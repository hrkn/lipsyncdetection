name: Build macOS Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-mac:
    name: Build macOS Binary (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            name: Apple Silicon (M1/M2/M3)
          - target: x86_64-apple-darwin
            name: Intel Mac

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: lipsyncdetection-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/lipsyncdetection

      - name: Prepare FFmpeg bundled package
        run: |
          TARGET="${{ matrix.target }}"
          if [ "$TARGET" = "aarch64-apple-darwin" ]; then
            FFMPEG_URL="https://github.com/Tyrrrz/FFmpegBin/releases/latest/download/ffmpeg-osx-arm64.zip"
          else
            FFMPEG_URL="https://github.com/Tyrrrz/FFmpegBin/releases/latest/download/ffmpeg-osx-x64.zip"
          fi

          mkdir -p ffmpeg_tmp
          curl -L "$FFMPEG_URL" -o ffmpeg_tmp/ffmpeg.zip
          unzip -o ffmpeg_tmp/ffmpeg.zip -d ffmpeg_tmp/

          BUNDLED_DIR="target/$TARGET/bundled"
          mkdir -p "$BUNDLED_DIR"
          cp "target/$TARGET/release/lipsyncdetection" "$BUNDLED_DIR/"

          find ffmpeg_tmp -name "ffmpeg" -type f -exec cp {} "$BUNDLED_DIR/" \;
          find ffmpeg_tmp -name "ffprobe" -type f -exec cp {} "$BUNDLED_DIR/" \;

          chmod +x "$BUNDLED_DIR/lipsyncdetection" "$BUNDLED_DIR/ffmpeg" "$BUNDLED_DIR/ffprobe"
          xattr -dr com.apple.quarantine "$BUNDLED_DIR"/* || true
          rm -rf ffmpeg_tmp

      - name: Upload ffmpeg-bundled artifact
        uses: actions/upload-artifact@v4
        with:
          name: lipsyncdetection-ffmpeg-${{ matrix.target }}
          path: target/${{ matrix.target }}/bundled/

  release:
    name: Create GitHub Release
    needs: build-mac
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compress binaries
        run: |
          cd artifacts
          mkdir release_assets
          for dir in *; do
            if [ -d "$dir" ] && [ "$dir" != "release_assets" ]; then
              (cd "$dir" && zip -r "../release_assets/${dir}.zip" .)
            fi
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
